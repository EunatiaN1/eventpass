[package]
name = "eventpass"
version = "0.1.0"
description = "EventPass ticketing program using Metaplex Core"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "eventpass"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.32.1"
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor", "anchor-0-32"] }
